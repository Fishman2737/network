
name: Remote Linux Browser

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Install Linux desktop and Chrome
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ca-certificates \
            curl \
            wget \
            gnupg \
            xvfb \
            x11-utils \
            x11-xserver-utils \
            dbus-x11 \
            dwm \
            xterm \
            python3 \
            python3-pip \
            python3-venv \
            jq

          # Install Google Chrome Stable
          sudo install -d -m 0755 /etc/apt/keyrings

          curl -fsSL \
            https://dl.google.com/linux/linux_signing_key.pub \
            | sudo gpg --dearmor \
                -o /etc/apt/keyrings/google-chrome.gpg

          echo \
            "deb [arch=amd64 signed-by=/etc/apt/keyrings/google-chrome.gpg] https://dl.google.com/linux/chrome/deb/ stable main" \
            | sudo tee /etc/apt/sources.list.d/google-chrome.list

          sudo apt-get update

          sudo apt-get install -y google-chrome-stable

          google-chrome --version

      - name: Install Selkies
        shell: bash
        run: |
          set -euo pipefail

          python3 -m venv "$HOME/selkies-venv"

          "$HOME/selkies-venv/bin/pip" install --upgrade pip

          "$HOME/selkies-venv/bin/pip" install selkies

          echo "$HOME/selkies-venv/bin" >> "$GITHUB_PATH"

      - name: Install cloudflared
        shell: bash
        run: |
          set -euo pipefail

          curl -fsSL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /tmp/cloudflared

          sudo install -m 0755 /tmp/cloudflared \
            /usr/local/bin/cloudflared

          cloudflared --version

      - name: Start desktop
        shell: bash
        env:
          SELKIES_PASSWORD: ${{ secrets.SELKIES_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -z "$SELKIES_PASSWORD" ]; then
            echo "Set SELKIES_PASSWORD in GitHub Secrets."
            exit 1
          fi

          export DISPLAY=:99
          export XDG_RUNTIME_DIR=/tmp/runtime-runner

          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"

          # Start virtual X11 display
          Xvfb :99 \
            -screen 0 1920x1080x24 \
            -ac \
            +extension RANDR \
            +extension GLX \
            -nolisten tcp \
            > /tmp/xvfb.log 2>&1 &

          echo $! > /tmp/xvfb.pid

          # Wait for X11
          for i in $(seq 1 30); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              break
            fi

            sleep 1
          done

          xdpyinfo -display :99 >/dev/null

          # Start dwm
          dwm > /tmp/dwm.log 2>&1 &

          echo $! > /tmp/dwm.pid

          # Launch Chrome with WebGPU software rendering
          google-chrome \
            --no-first-run \
            --disable-default-apps \
            --disable-dev-shm-usage \
            --window-size=1280,800 \
            --user-data-dir="$HOME/chrome-profile" \
            --enable-unsafe-webgpu \
            --enable-features=Vulkan \
            --use-vulkan=swiftshader \
            --use-webgpu-adapter=swiftshader \
            --disable-vulkan-surface \
            --ignore-gpu-blocklist \
            about:blank \
            > /tmp/chrome.log 2>&1 &

          echo $! > /tmp/chrome.pid

          # Start Selkies
          selkies \
            --public \
            --port=8080 \
            --enable-https=false \
            --basic-auth-user=browser \
            --basic-auth-password="$SELKIES_PASSWORD" \
            --encoder=h264enc \
            --enable-resize=false \
            > /tmp/selkies.log 2>&1 &

          echo $! > /tmp/selkies.pid

          # Wait for Selkies.
          # HTTP 401 is valid when authentication is enabled.
          SELKIES_READY=false

          for i in $(seq 1 60); do
            HTTP_CODE=$(curl \
              -sS \
              -o /dev/null \
              -w '%{http_code}' \
              http://127.0.0.1:8080/ \
              || true)

            if [[ "$HTTP_CODE" == "200" || "$HTTP_CODE" == "401" ]]; then
              SELKIES_READY=true
              echo "Selkies is responding. HTTP $HTTP_CODE"
              break
            fi

            echo "Waiting for Selkies... HTTP ${HTTP_CODE:-000}"

            sleep 2
          done

          if [[ "$SELKIES_READY" != "true" ]]; then
            echo "Selkies failed to start."

            cat /tmp/selkies.log

            exit 1
          fi

          echo "Desktop started successfully."

      - name: Start Cloudflare Quick Tunnel
        shell: bash
        run: |
          set -euo pipefail

          cloudflared tunnel \
            --url http://localhost:8080 \
            --no-autoupdate \
            > /tmp/cloudflared.log 2>&1 &

          echo $! > /tmp/cloudflared.pid

          # Wait for the public tunnel URL
          URL=""

          for i in $(seq 1 60); do
            URL=$(grep -oE \
              'https://[a-zA-Z0-9-]+\.trycloudflare\.com' \
              /tmp/cloudflared.log \
              | head -n 1 || true)

            if [ -n "$URL" ]; then
              echo "=================================="
              echo "Cloudflare Quick Tunnel:"
              echo "$URL"
              echo "=================================="

              break
            fi

            sleep 2
          done

          if [ -z "$URL" ]; then
            echo "Tunnel URL was not detected."

            cat /tmp/cloudflared.log

            exit 1
          fi

      - name: Keep desktop running
        shell: bash
        run: |
          set -euo pipefail

          echo "Remote desktop is running."
          echo "Chrome is available inside Selkies."
          echo "WebGPU is enabled using SwiftShader."

          while true; do
            if ! kill -0 "$(cat /tmp/selkies.pid)" 2>/dev/null; then
              echo "Selkies stopped."

              cat /tmp/selkies.log

              exit 1
            fi

            if ! kill -0 "$(cat /tmp/cloudflared.pid)" 2>/dev/null; then
              echo "Cloudflare Tunnel stopped."

              cat /tmp/cloudflared.log

              exit 1
            fi

            sleep 30
          done

      - name: Diagnose services
        if: always()
        shell: bash
        run: |
          echo "=== Selkies ==="
          cat /tmp/selkies.log || true

          echo "=== Chrome ==="
          cat /tmp/chrome.log || true

          echo "=== dwm ==="
          cat /tmp/dwm.log || true

          echo "=== Xvfb ==="
          cat /tmp/xvfb.log || true

          echo "=== Cloudflare ==="
          cat /tmp/cloudflared.log || true
